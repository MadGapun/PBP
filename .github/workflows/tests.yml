name: Tests

# Beta-Stabilisierung: automatischer Gruen-Gate fuer die Test-Suite.
# Hintergrund: Es gab bisher kein CI. Dadurch blieb z.B. unbemerkt, dass die
# Suite ohne das [docs]-Extra (python-docx/pypdf) 19 Failures wirft und dass
# FastMCP 3.x die Prompt-Delegation brach. Dieser Workflow installiert die
# gleichen Extras wie der Endnutzer-Installer und laesst die volle Suite laufen.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install package with docs + dev + scraper extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs,dev,scraper]"

      - name: Install Playwright Chromium (Dashboard-Browser-Smokes)
        run: python -m playwright install --with-deps chromium

      - name: Run full test suite
        run: pytest -q

      - name: Frontend-Datumslogik (Kipp-Test, Europe/Berlin, #701)
        # Bewusst in UTC ausgefuehrt: beweist, dass die relativen Datumslabels
        # auch dann in Europe/Berlin rechnen, wenn der Host nicht auf Berlin
        # steht. Nutzt den auf den Runnern vorinstallierten Node, kein Framework.
        run: TZ=UTC node frontend/src/lib/relativeDate.test.mjs

      - name: Frontend-Link-Klassifikation (#765)
        # Haelt die Frontend-Heuristik mit is_search_result_url (#763) im
        # Backend synchron — dieselben Faelle auf beiden Seiten.
        run: node frontend/src/lib/jobLink.test.mjs

      - name: Release-Gate (Versionskonsistenz + First-Run-Smoke)
        run: python release_check.py
