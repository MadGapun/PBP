name: Tests

# Beta-Stabilisierung: automatischer Gruen-Gate fuer die Test-Suite.
# Hintergrund: Es gab bisher kein CI. Dadurch blieb z.B. unbemerkt, dass die
# Suite ohne das [docs]-Extra (python-docx/pypdf) 19 Failures wirft und dass
# FastMCP 3.x die Prompt-Delegation brach. Dieser Workflow installiert die
# gleichen Extras wie der Endnutzer-Installer und laesst die volle Suite laufen.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install package with docs + dev + scraper extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs,dev,scraper]"

      - name: Install Playwright Chromium (Dashboard-Browser-Smokes)
        run: python -m playwright install --with-deps chromium

      - name: Run full test suite
        run: pytest -q

      - name: Frontend-Datumslogik (Kipp-Test, Europe/Berlin, #701)
        # Bewusst in UTC ausgefuehrt: beweist, dass die relativen Datumslabels
        # auch dann in Europe/Berlin rechnen, wenn der Host nicht auf Berlin
        # steht. Nutzt den auf den Runnern vorinstallierten Node, kein Framework.
        run: TZ=UTC node frontend/src/lib/relativeDate.test.mjs

      - name: Frontend-Link-Klassifikation (#765)
        # Haelt die Frontend-Heuristik mit is_search_result_url (#763) im
        # Backend synchron — dieselben Faelle auf beiden Seiten.
        run: node frontend/src/lib/jobLink.test.mjs

      - name: Dashboard-Regeln (#974 G26, #984 G32)
        # Onboarding-KPI nur im Onboarding, Zeilenregel gegen den Stapel
        # "Kicker + Headline + Beschreibung". Deckt die sieben
        # Readiness-Stufen aus workspace_service.py ab.
        run: node frontend/src/lib/dashboardRegeln.test.mjs

      - name: Datenguete-Regeln (#989 C51)
        # Die Liste im Browser muss dieselbe Reihenfolge zeigen wie die
        # im Chat. Dieselben Faelle wie tests/test_v1739_datenguete_989.py
        # — weicht eine Seite ab, steht wieder das Unbekannte oben.
        run: node frontend/src/lib/datenguete.test.mjs

      - name: Gehaltskennzahl (#1015 C68)
        # Die Durchschnittszahl muss ausweisen, wie viele ihrer Werte
        # geschaetzt sind. Die Funktion lag vorher wortgleich in zwei
        # Seiten; der Test haengt an der gemeinsamen Fassung.
        run: node frontend/src/lib/gehaltsKennzahl.test.mjs

      - name: Jobsuche-Hinweis (#1033 G47)
        # Vier Zustaende, die im Kaestchen der Navigation gleich aussahen:
        # Funde, keine Funde, Abbruch, nicht gestartet. Ein Timeout einzelner
        # Quellen faerbt nicht als Warnung.
        run: node frontend/src/lib/jobsucheHinweis.test.mjs

      - name: Fund- und Veroeffentlichungsdatum (#1032 G46)
        # Karte und Detail-Dialog sagen dasselbe; ein fehlendes Datum ergibt
        # keinen Ersatztext, und ein reines Datum ist in jeder Zeitzone
        # derselbe Tag.
        run: node frontend/src/lib/stellenDaten.test.mjs

      - name: Score-Anzeige mit hoechstens einer Nachkommastelle (Node)
        # #1035: `6.199999999999999` stand auf der Stellenkarte. Jede
        # Score-Ausgabe im Frontend geht durch lib/score.js.
        run: node frontend/src/lib/score.test.mjs

      - name: Stellenangaben fuer Karte und Popup (Node)
        # #1044: das Popup "Stellendetails" las Rohwerte und zeigte eine Stelle
        # anders als die Karte. Beide Ansichten gehen durch lib/stellenAngaben.js.
        run: node frontend/src/lib/stellenAngaben.test.mjs

      - name: Google-Jobs-Auswertung im Browser (Node)
        # #1067: die Klassen-Selektoren vom Mai 2026 trafen nur noch die
        # Suchreiter und lieferten 13 "Stellen" namens KI-Modus, Bilder,
        # News — ohne Fehler. Das Skript ist jetzt am sichtbaren Text
        # verankert und meldet Navigation als Fehler.
        run: node frontend/src/lib/googleJobsExtraction.test.mjs

      - name: Gegliederter Anzeigentext in der Detailansicht (Node)
        # #1047: textExcerpt fasste jeden Leerraum zusammen, die Detailansicht
        # verlor Absaetze und Listen. Sie geht jetzt durch lib/textAuszug.js.
        run: node frontend/src/lib/textAuszug.test.mjs

      - name: Die beiden Daumen an der Stelle (Node)
        # #1052: Richtung und Farbe sind zwei Kanaele — "ungeprueft" darf
        # nie aussehen wie "passt nicht". Die Zuordnung steht in
        # lib/daumen.js, gerechnet wird auf dem Server.
        run: node frontend/src/lib/daumen.test.mjs

      - name: Detailbewertungs-Prompt fuer Karte und Fit-Dialog (Node)
        # #1050: der Prompt verlangt das Speichern mit stelle_analyse_speichern
        # und nennt einen vorhandenen Befund; Karte und Dialog teilen ihn.
        run: node frontend/src/lib/detailbewertung.test.mjs

      - name: Prompt-Aufloesung der Dashboard-Knoepfe (Node)
        # v1.7.120: ein "/name" ist ein Workflow oder ein Fehler; Argumente
        # gehen beim Aufloesen nicht verloren; ein Werkzeug geht als Satz hinaus.
        run: node frontend/src/lib/promptAufloesung.test.mjs

      - name: Etiketten der Quellen-Karten (Node)
        # #1059: Weg, Tempo, Eigenschaft und Zustand getrennt; kein Text doppelt;
        # das Tempo heisst nie "Browser".
        run: node frontend/src/lib/quellenBadges.test.mjs

      - name: Bewerbungs-Formular (Node)
        # G58 (#1087): deutsche Beschriftungen, Vorgabe in_vorbereitung,
        # Datum nur bei abgeschickter Bewerbung.
        run: node frontend/src/lib/bewerbungFormular.test.mjs

      - name: Hinweiszone (Node)
        # G60 (#1087): hoechstens ein Banner, nur auf dem Dashboard, feste
        # Reihenfolge; Suche erst nach sieben Tagen dringlich.
        run: node frontend/src/lib/hinweisZone.test.mjs

      - name: Stellenkarte - eine Kernaussage, ein Grund (G62)
        # G62 (#1087): Urteil vor Daumen, Grund in Klartext, Fakten als Zeile.
        run: node frontend/src/lib/stellenKarte.test.mjs

      - name: Arbeitsliste - Vorschau hoechstens fuenf Zeilen (G64)
        # G64 (#1087): Dashboard und Bewerbungen zeigen eine Vorschau, der
        # Aufgaben-Tab ist die Arbeitsliste.
        run: node frontend/src/lib/arbeitsliste.test.mjs

      - name: Anzeigenamen statt Rohwerte (G65)
        # G65 (#1087): Gruende, Quellen, Bewerbungsart als Wort.
        run: node frontend/src/lib/anzeige.test.mjs

      - name: Kennzahlen mit fester Bedeutung (G61)
        # G61 (#1087): Bewerbungen pro Woche, Top-Stellen, kein 0-Gehalt.
        run: node frontend/src/lib/kennzahlen.test.mjs

      - name: Hilfe je Tab und beide Meldewege (G68)
        # G68 (#1087 D9): jede Seite hat Hilfe, Mail-Weg ohne GitHub.
        run: node frontend/src/lib/hilfe.test.mjs

      - name: Kontrast der Farbpaletten (G71)
        # G71 (#1087 H4): jede Voreinstellung, beide Modi, Lesetext >= 4,5:1.
        run: node frontend/src/lib/kontrast.test.mjs

      - name: UI-Texte - echte Umlaute und ein Wort je Begriff (G66)
        # G66 (#1087 E1, E2): kein "ae/oe/ue" als Umschrift in sichtbaren
        # Texten, keine Glossar-Doppelwoerter (Follow-up, Todo, Docs ...).
        run: python scripts/ui_texte_pruefen.py

      - name: Release-Gate (Versionskonsistenz + First-Run-Smoke)
        run: python release_check.py
