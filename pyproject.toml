[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bewerbungs-assistent"
version = "1.7.21"
description = "PBP — KI-gestuetzter Bewerbungsassistent als MCP-Server fuer Claude Desktop. Stellensuche, Bewerbungs-Tracking, Lebenslauf-/Anschreiben-Generierung, Interview-Coaching."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Markus Birzite" }
]
keywords = [
    "mcp", "model-context-protocol", "claude", "claude-desktop",
    "anthropic", "ai", "llm",
    "bewerbung", "job-search", "career", "ats",
    "lebenslauf", "cv", "resume", "anschreiben", "cover-letter",
    "scraper", "stellensuche", "personalvermittlung",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
    "Topic :: Office/Business :: Scheduling",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Communications",
    "Natural Language :: German",
]

dependencies = [
    # #692/K6: Major-Version begrenzen. FastMCP 3.x hat interne APIs umgebaut
    # (_prompt_manager entfiel) — ein ungepinntes >=2.0 liess den Bump lautlos
    # durch. <4 verhindert, dass der naechste Major-Sprung erneut Interna bricht.
    "fastmcp>=3.0,<4",
    "uvicorn>=0.30",
    "fastapi>=0.115",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "geopy>=2.4",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    # #500: Jobsuche ist Kern-Feature — JobSpy liefert Indeed/LinkedIn/Glassdoor/Google
    # ohne Login. Vorher im [scraper]-Extra, war damit aber bei den meisten
    # Installationen nicht aktiv -> Booster nicht sichtbar.
    "python-jobspy>=1.1",
]

[project.optional-dependencies]
scraper = [
    "playwright>=1.40",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "python-jobspy>=1.1",
]
docs = [
    "python-docx>=1.1",
    "pypdf>=4.0",
    "fpdf2>=2.7",
    "matplotlib>=3.8",
]
export = [
    "openpyxl>=3.1",
]
email = [
    "extract-msg>=0.48",
    "icalendar>=5.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
all = [
    "bewerbungs-assistent[scraper,docs,export,email]",
]

[project.urls]
Homepage = "https://github.com/MadGapun/PBP"
Repository = "https://github.com/MadGapun/PBP"
Documentation = "https://github.com/MadGapun/PBP/wiki"
Changelog = "https://github.com/MadGapun/PBP/blob/main/CHANGELOG.md"
Issues = "https://github.com/MadGapun/PBP/issues"
Releases = "https://github.com/MadGapun/PBP/releases"

[project.scripts]
bewerbungs-assistent = "bewerbungs_assistent:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bewerbungs_assistent"]

[tool.pytest.ini_options]
# test_demo.py im Projekt-Root ist ein Dashboard-Launcher-Script, kein Pytest-Test.
# Ohne testpaths wuerde pytest es einsammeln und beim Start des Uvicorn-Servers haengen.
testpaths = ["tests"]
